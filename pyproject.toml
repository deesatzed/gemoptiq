[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-sentinel"
version = "0.1.0"
description = "Local-first supervision console for autonomous coding agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "textual>=0.80",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]

[project.scripts]
sentinel = "sentinel.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
